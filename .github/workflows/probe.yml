name: Probe inspections portal (temporary)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/richmond-inspections-telegram-bot-va58r6
    paths:
      - 'agent/probe_inspections.py'
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python agent/probe_inspections.py
